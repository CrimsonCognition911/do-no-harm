schema_version: 3
id: stemi-the-ecg-cannot-wait
version: 0.1.0-draft
title: "The ECG cannot wait"
participant_mode: doctor
specialty: emergency_medicine
session_mode: coached
environment: openmrs_ed

# Authoring draft only: not accepted by the current compiled-case planner.
# No model or application may turn these flags into clinical approval.
status: draft_pending_clinical_review
runtime_enabled: false
scored_use_allowed: false
synthetic_only: true
clinical_review:
  required: true
  reviewer: null
  reviewed_at: null
  approved_case_sha256: null
  approved_rubric_sha256: null
  approved_policy_sha256: null
  open_items:
    - Approve ECG interpretation and supply a licensed synthetic or teaching ECG asset.
    - Approve local STEMI activation, transfer and medication protocols.
    - Approve the synthetic deterioration assumptions and its timing.
    - Approve criterion alternatives, evidence requirements and coaching thresholds.
    - Verify actual OpenMRS workflow, resource mappings and permission boundaries.

source_refs:
  aha_acc_2025:
    url: https://www.jacc.org/doi/10.1016/j.jacc.2024.11.009
    supporting_publisher_pdf: https://www.ahajournals.org/doi/pdf/10.1161/CIR.0000000000001309?download=true
    checked_on: "2026-09-13"
    scope: ECG assessment and not delaying STEMI reperfusion for biomarkers.
  nice_ng185:
    url: https://www.nice.org.uk/guidance/ng185/chapter/Recommendations
    sections: ["1.1.1", "1.1.3", "1.1.4", "1.1.6"]
    checked_on: "2026-09-13"
    scope: Urgent reperfusion assessment, timely PCI when feasible and aspirin eligibility.
  local_stemi_pathway:
    url: null
    approved_version: null
    required_before_scored_use: true

clock:
  unit: simulation_milliseconds
  first_medical_contact_ms: 0
  symptom_onset_ms: -2700000
  timing_note: "Event times below are proposed teaching-case timings, not predictions of infarct physiology or guideline-derived pass/fail limits. Record simulation time separately from wall-clock latency."
  silent_time_compression_allowed: false
  pause_freezes_time: true

initial_participant_information:
  patient_label: Synthetic patient MI-001
  age_years: 58
  sex_for_case_description: male
  complaint: "Heavy central chest pressure for 45 minutes, radiating to the left arm, with sweating and nausea."
  appearance: Alert, anxious and diaphoretic.
  vital_signs:
    heart_rate_per_minute: 96
    blood_pressure_mmHg: {systolic: 136, diastolic: 84}
    respiratory_rate_per_minute: 20
    spo2_percent_on_room_air: 97
    temperature_celsius: 36.8
  initial_tests: ECG requested at triage but not yet acquired; blood tests not yet collected.
  environment: "Synthetic ED with a PCI activation pathway. Actual availability and expected times must be confirmed, not assumed."

history_available_on_request:
  risk_factors: Hypertension and current smoking.
  previous_coronary_disease: None known in this fictional history.
  regular_medication: Amlodipine; no known regular antiplatelet or anticoagulant.
  allergy_history: No known medication allergy when specifically checked.
  recent_bleeding_or_major_surgery: None reported when specifically checked.
  recent_pde5_inhibitor_use: None reported when specifically checked.
  note: "These are authored fictional facts. Do not infer that the doctor checked them unless there is evidence."

examiner_only:
  intended_working_diagnosis: Acute anterior STEMI.
  hidden_rubric_ref: README.md
  expected_high_level_priorities:
    - Assess and monitor the patient while obtaining and interpreting the ECG promptly.
    - Recognize the STEMI pattern and activate the appropriate urgent reperfusion pathway.
    - Do not defer reperfusion decisions merely to await a troponin result.
    - Check relevant contraindications and arrange initial treatment under the approved local protocol.
    - Reassess symptoms and haemodynamics; escalate appropriately if the patient deteriorates.
  not_scored_in_this_mvp:
    - Exact drug doses, anticoagulant selection or complex fibrinolysis eligibility.
    - Coronary anatomy, procedural PCI technique or post-PCI outcomes.
    - An unseen ECG image, an unreported history item or unsupported OpenMRS action.

state_contract:
  initial:
    ecg_acquired: false
    diagnostic_ecg_published: false
    blood_sample_collected: false
    reperfusion_pathway_activated: false
    reperfusion_completed: false
    handoff_completed: false
  authority:
    ecg_acquired: Backend-confirmed acquisition; an order or spoken request is not acquisition.
    blood_sample_collected: Backend-confirmed collection; an order is not a collected sample.
    reperfusion_pathway_activated: Supported, backend-confirmed pathway activation, separately from voiced intention.
    reperfusion_completed: "Not supported by the MVP; never set true merely because cardiology was called or aspirin was given."
    handoff_completed: Confirmed simulated receiving-team handoff, not a statement that handoff will happen.
  unsupported_action_handling: Preserve spoken intent and mark execution evidence unavailable; do not invent success or penalize missing tooling.

events:
  - id: diagnostic_ecg
    kind: clinical_information
    visibility_after_release: participant
    trigger: {kind: confirmed_action, state_ref: ecg_acquired}
    publication_delay_ms: 0
    resource_key: diagnostic_ecg
    payload:
      interpretation: "Synthetic ECG report: sinus rhythm with anterior ST-segment elevation in contiguous precordial leads, consistent with acute anterior STEMI in this clinical context."
      image_asset: null
      image_status: clinician_reviewed_teaching_asset_required
    evidence_note: "Until the image is supplied, this is an ECG-report simulation, not demonstrated visual ECG interpretation. Publication, screen display and speech delivery are separate receipts."

  - id: troponin_result
    kind: clinical_information
    visibility_after_release: participant
    trigger: {kind: confirmed_action_plus_delay, state_ref: blood_sample_collected}
    publication_delay_ms: 300000
    resource_key: troponin_result
    payload:
      qualitative_result: Above the local assay's upper reference limit in this synthetic case.
      numeric_value: null
      assay: null
      units: null
      reference_limit: null
    release_gate: "An approved assay/value/unit/reference-limit mapping is required before an actual OpenMRS lab result is written. The qualitative draft is not a mapped numeric lab observation."

  - id: persistent_ischaemia_with_hypotension
    kind: clinical_consequence
    visibility_after_release: participant
    trigger:
      kind: state_and_elapsed_time
      earliest_ms: 360000
      requires: {reperfusion_completed: false, handoff_completed: false}
    resource_key: reassessment_vitals
    payload:
      symptoms: Persistent chest pain with new light-headedness and clamminess.
      heart_rate_per_minute: 112
      blood_pressure_mmHg: {systolic: 90, diastolic: 60}
      respiratory_rate_per_minute: 24
      spo2_percent_on_room_air: 95
    clinical_review_note: "Authored hypothetical complication, not a claim that every untreated STEMI deteriorates at six minutes. Can occur even after correct pathway activation while reperfusion remains pending. Requires urgent reassessment, not an automatic diagnosis of cardiogenic shock from one BP value."
    performance_score_dependency: none
    optional_challenge_may_delay_this_event: false

  - id: transfer_logistics_challenge
    kind: optional_educational_challenge
    visibility_after_release: participant
    trigger:
      kind: examiner_selection
      requires: {diagnostic_ecg_published: true, reperfusion_pathway_activated: true, handoff_completed: false}
      permitted_window_ms: {earliest: 120000, latest: 300000}
    resource_key: transfer_update
    difficulty: 2
    payload:
      update: "The receiving team asks for your contingency plan if the currently proposed transfer cannot meet the local reperfusion time target."
    boundary: "A hypothetical planning question, not a fabricated cancellation of an already accepted transfer. Do not change a confirmed booking or patient physiology to raise difficulty."

adaptation:
  policy_id: stemi-adaptive-policy
  version: 0.1.0-draft
  freeze_before_run: [case, rubric, policy, mappings, allowed_branches]
  checkpoints: [confirmed_action, event_delivered, scheduled_review]
  max_pending_challenges: 1
  require_same_run_evidence: true
  require_current_execution_version: true
  good_management:
    requires: Evidence-grounded recognition and confirmed pathway activation.
    permitted_change: Select transfer_logistics_challenge within its frozen window.
  struggling:
    requires: Supported concern with enough observable context; absence of an API receipt alone is not clinical failure.
    permitted_change: Withhold new optional challenges; in coached mode propose an evidence-grounded pause.
    assessment_behavior: Continue the declared clinical path without hints; retain finding for debrief.
  insufficient_evidence:
    permitted_change: Retain current path; use neutral clarification only if it does not reveal the answer.
  invariants:
    - Do not rewrite grading criteria or release an unreviewed clinical event.
    - Do not postpone due clinical consequences to make room for optional teaching.
    - Pathway activation does not prove reperfusion or automatically normalize vital signs.
    - Log selected path, difficulty, evidence IDs, reasoning and all frozen hashes.

rubric_contract:
  ref: README.md
  version: 0.1.0-draft
  criteria:
    - id: mi.initial_assessment
      objective_observations: [first_medical_contact_time, ecg_acquisition_receipt, monitoring_evidence]
      clinical_judgment: Appropriate urgency and assessment in context.
    - id: mi.ecg_interpretation
      objective_observations: [ecg_publication_receipt, ecg_display_receipt, doctor_utterance_or_note]
      clinical_judgment: Recognizes the released STEMI report or supplied reviewed ECG.
    - id: mi.reperfusion_escalation
      objective_observations: [diagnostic_ecg_available_time, pathway_intent, pathway_activation_receipt]
      clinical_judgment: Urgent appropriate escalation without waiting for biomarkers alone.
    - id: mi.initial_treatment_safety
      objective_observations: [history_queries, relevant_contraindication_evidence, treatment_intent, supported_execution_receipts]
      clinical_judgment: Appropriate local-protocol treatment and attention to contraindications; dose scoring excluded.
    - id: mi.reassessment
      objective_observations: [new_vitals_publication, new_vitals_delivery, reassessment_actions, escalation_evidence]
      clinical_judgment: Responds appropriately to the new hypotension and ongoing symptoms.
    - id: mi.communication
      objective_observations: [doctor_explanation, receiving_team_handoff, teach_back]
      clinical_judgment: Clear reasoning, shared plan and communication of risk.
  outcomes: [acceptable, concern, insufficient_evidence]
  requires_clinician_review: true
  numeric_pass_fail_score_enabled: false
  alternatives_policy: Accept clinically justified alternatives under the stated setting and approved local guideline; avoid keyword-only grading.

coaching:
  example_trigger:
    criterion_id: mi.reperfusion_escalation
    requires:
      - Diagnostic ECG was actually made available; display/awareness evidence is checked.
      - Doctor explicitly defers escalation solely for troponin, or other reviewed evidence supports that conclusion.
      - Examiner considers context, appropriate alternatives and unsupported tooling before raising a concern.
    missing_evidence_result: insufficient_evidence
  pause_requires: [write_gate_closed, in_flight_work_reconciled, simulation_clock_frozen, audio_flushed, current_version_acknowledged]
  review_surface: separate_read_only_ecg_and_event_timeline
  teaching_objective: Explain why this released ECG and presentation demand urgent reperfusion-pathway action rather than waiting for a biomarker.
  teach_back_prompt: "What will you do now, and what evidence would confirm that the plan has actually been carried out?"
  coached_resume: Mark subsequent work assisted; complete teach-back and revoke review access before new-version resume.
  assessment_intervention: End the unassisted portion and move to debrief; no return to the same scored attempt.

openmrs_bindings:
  status: unresolved
  patient_uuid: null
  visit_uuid: null
  emergency_location_uuid: null
  ecg_orderable_uuid: null
  ecg_result_concept_uuid: null
  troponin_orderable_uuid: null
  troponin_result_concept_uuid: null
  reassessment_encounter_type_uuid: null
  blood_pressure_concepts: null
  pathway_activation_workflow: null
  receiving_team_handoff_workflow: null
  rule: "Resolve from the synthetic OpenMRS deployment; never guess UUIDs or manufacture a successful workflow receipt."

completion:
  successful_demo_endpoint: Confirmed simulated STEMI-team handoff with pending reperfusion accurately labelled.
  no_claims: [actual_reperfusion, clinical_validation, specialist_certification, live_provider_integration]
